name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/public
          cp -r dist android/app/src/main/assets/public
          ls -la android/app/src/main/assets/

      - name: Configure Gradle mirrors
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          echo 'org.gradle.daemon=false' >> ~/.gradle/gradle.properties
          echo 'android.useAndroidX=true' >> android/gradle.properties
          echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || cat build/reports/problems/problems-report.html 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaWorld-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
